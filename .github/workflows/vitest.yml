name: 'vitest test'
on: pull_request
jobs:
  Component-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
#         25.07.14 node 최신 lts 버전
          node-version: 22.17.0
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: run vitest
        run: npm run test
